global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: 'logistics-api'
    # The API metrics are available at :8080/metrics (Prometheus handler)
    # So we can scrape them directly or let OTel scrape them. Let's scrape directly for simplicity.
    static_configs:
      - targets: ['host.docker.internal:8080']
