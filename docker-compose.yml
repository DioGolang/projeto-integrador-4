services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: logistics-api
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Sobrescreve as variáveis locais para conectar na rede do docker
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  postgres:
    image: postgis/postgis:18-master
    container_name: logistics-postgres
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: logistics-redis
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: logistics-rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: logistics-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheusdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.4.0
    container_name: logistics-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
      - tempodata:/var/tempo
    ports:
      - "127.0.0.1:3200:3200" # Porta HTTP
    expose:
      - "4317"      # OTLP gRPC
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.7
    container_name: logistics-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/tmp/loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: logistics-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    expose:
      - "8888" # Internal telemetry metrics
      - "8889" # Prometheus metrics exporter
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.1
    container_name: logistics-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD environment variable must be explicitly configured and cannot be empty}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE:-Viewer}
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: logistics-simulator
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - API_URL=http://api:8080
      - OSRM_URL=${OSRM_URL:-http://router.project-osrm.org/route/v1/driving}
      - MOTO_SPEED_KMH=${MOTO_SPEED_KMH:-36.0}
      - SIM_SPEED_FACTOR=${SIM_SPEED_FACTOR:-1.0}
      - DELIVERER_EMAIL=${DELIVERER_EMAIL:-entregador@elo.com}
      - DELIVERER_PASSWORD=${DELIVERER_PASSWORD:-Entregador@123!}
      - DELIVERER_FINGERPRINT=${DELIVERER_FINGERPRINT:-simulator-deliverer-worker-1}
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  prometheusdata:
  tempodata:
  grafanadata:
  lokidata:
