syntax = "proto3";
package logistics.v1;

option go_package = "github.com/dvasconcellos/elo/api/gen/logistics/v1";

import "google/protobuf/timestamp.proto";

// O Serviço Principal do Motor Logístico
service LogisticsService {
  // RF01: Criação de pedido pelo lojista (Unary RPC)
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  
  // RF03: Aceite de corrida pelo entregador (Unary RPC)
  rpc AcceptDelivery(AcceptDeliveryRequest) returns (AcceptDeliveryResponse);
  
  // RF06: Atualização de localização (Unary RPC)
  // Client Streaming futuro se a frota crescer muito
  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse);
  
  // Atribuição de geometria de rota (Unary RPC)
  rpc AssignRoute(AssignRouteRequest) returns (AssignRouteResponse);
  
  // RF05/RNF09: Conclusão física da corrida com validação de PIN e Geofencing (Unary RPC)
  rpc CompleteDelivery(CompleteDeliveryRequest) returns (CompleteDeliveryResponse);

  // Desbloqueio operacional e auditoria de entrega congelada (Unary RPC - ADMIN only)
  rpc UnfreezeDelivery(UnfreezeDeliveryRequest) returns (UnfreezeDeliveryResponse);

  // RF04/RNF06: Atualização em tempo real (Server Streaming RPC)
  rpc StreamOrderStatus(StreamOrderStatusRequest) returns (stream StreamOrderStatusResponse);
}

// ---------------------------------------------------------
// Mensagens: Criação de Pedidos
// ---------------------------------------------------------

message CreateOrderRequest {
  CustomerInfo customer = 1;
  Coordinates destination = 2;
  repeated OrderItem items = 3;
  PackageSize package_size = 4;
}

enum PackageSize {
  PACKAGE_SIZE_UNSPECIFIED = 0;
  PACKAGE_SIZE_SMALL = 1;  // Cabe na bag de bicicleta
  PACKAGE_SIZE_LARGE = 2;  // Exige moto (ex: múltiplas pizzas)
}

message CustomerInfo {
  string name = 1;
  string phone = 2; // Obrigatório para o checkout hospedado
}

message Coordinates {
  double lat = 1;
  double lng = 2;
  string address = 3; // Opcional, para complementar
}

message OrderItem {
  string name = 1;
  int32 quantity = 2;
  double unit_price = 3;
}

message CreateOrderResponse {
  string order_id = 1;
  string status = 2;
  double delivery_fee = 3; // Frete calculado dinamicamente pelo backend
  google.protobuf.Timestamp created_at = 4;
  string delivery_pin = 5; // Retornado exclusivamente na criação para o lojista/cliente final
}

// ---------------------------------------------------------
// Mensagens: Aceite de Entrega
// ---------------------------------------------------------

message AcceptDeliveryRequest {
  string order_id = 1;
  // deliverer_id é injetado pelo backend via JWT Interceptor (Segurança Zero Trust)
}

message AcceptDeliveryResponse {
  bool success = 1;
  string status = 2;
  google.protobuf.Timestamp accepted_at = 3;
}

// ---------------------------------------------------------
// Mensagens: Localização de Frota
// ---------------------------------------------------------

message UpdateLocationRequest {
  Coordinates current_position = 1;
  string order_id = 2;
  // deliverer_id injetado via JWT
}

message UpdateLocationResponse {
  bool success = 1;
}

// ---------------------------------------------------------
// Mensagens: Streaming de Status
// ---------------------------------------------------------

message StreamOrderStatusRequest {
  string order_id = 1;
}

message RouteGeometry {
  string route_id = 1;
  int64 revision = 2;
  string leg = 3; // "TO_PICKUP", "TO_DROPOFF", etc.

  repeated Coordinates points = 4;

  double distance_meters = 5;
  int64 estimated_duration_ms = 6;
}

message StreamOrderStatusResponse {
  string order_id = 1;
  string status = 2; // "CREATED", "DISPATCHED", "ACCEPTED", etc.
  optional string deliverer_name = 3;
  google.protobuf.Timestamp updated_at = 4;
  Coordinates current_location = 5;
  string deliverer_id = 6;
  int64 sequence = 7;
  RouteGeometry route = 8;
}

message AssignRouteRequest {
  string order_id = 1;
  RouteGeometry route = 2;
}

message AssignRouteResponse {
  bool success = 1;
  int64 sequence = 2;
}

// ---------------------------------------------------------
// Mensagens: Conclusão de Entrega (Regras Físicas)
// ---------------------------------------------------------

message CompleteDeliveryRequest {
  string order_id = 1;
  string delivery_pin = 2; // PIN de 4 dígitos informado pelo recebedor no ato da entrega
  Coordinates current_position = 3; // Posição capturada no dispositivo no momento da entrega
}

message CompleteDeliveryResponse {
  bool success = 1;
  string status = 2; // "DELIVERED"
  bool route_divergence_flag = 3; // true se concluído na zona de tolerância (50m - 300m)
  double distance_meters = 4; // Distância geodésica calculada em metros
  google.protobuf.Timestamp delivered_at = 5;
}

// ---------------------------------------------------------
// Mensagens: Desbloqueio Operacional de Pedido Congelado
// ---------------------------------------------------------

message UnfreezeDeliveryRequest {
  string order_id = 1;
  string reason = 2; // Motivo da auditoria de desbloqueio operacional
}

message UnfreezeDeliveryResponse {
  bool success = 1;
  string status = 2; // "ACCEPTED"
}
